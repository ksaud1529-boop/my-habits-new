<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بكسل عاداتي</title><style>:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#29283a;background:#f8f6fc}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:28px 18px}header,.top,.habit-head,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:30px}h2{font-size:19px;margin:0 0 12px}.muted{color:#77758a;font-size:14px}.card{background:white;border:1px solid #ebe6f3;border-radius:20px;padding:20px;margin-top:20px;box-shadow:0 5px 25px #49346b08}button{border:0;border-radius:12px;padding:11px 17px;background:#7155b6;color:white;font:inherit;cursor:pointer}button:hover{filter:brightness(.95)}button.secondary{background:#eee8f8;color:#624a99}button.danger{background:#fff0f0;color:#a63e52}.stats{margin-top:22px}.stat{flex:1;min-width:145px;background:white;padding:19px;border-radius:17px;border:1px solid #ebe6f3}.stat strong{display:block;font-size:27px;margin-top:7px;color:#624a99}form{display:flex;gap:9px;flex-wrap:wrap}input{font:inherit;padding:12px;border:1px solid #ddd5eb;border-radius:11px;flex:1;min-width:180px}input[type=color]{min-width:54px;max-width:60px;padding:4px;height:46px}.habit-head{margin-bottom:15px}.habit-head h2{margin:0}.grid{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px;overflow-x:auto;padding:4px 2px 10px;direction:ltr;justify-content:start}.pixel{width:13px;height:13px;background:#eeeaf4;border-radius:3px;cursor:pointer;border:1px solid #e7e0ee}.pixel.future{opacity:.28;cursor:default}.pixel:hover:not(.future){outline:2px solid #8c77b8}.legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:#77758a}.sample{height:12px;width:12px;border-radius:3px;background:#eeeaf4}.empty{text-align:center;padding:35px 10px;color:#77758a}.today{background:#f3eefb;border-radius:12px;padding:10px 13px;font-size:14px}.today.done{background:#e7f6ec;color:#257143}footer{text-align:center;margin:30px;color:#888}.year{font-weight:700;color:#624a99}@media(max-width:550px){h1{font-size:25px}.card{padding:15px}.stat{min-width:100px}}</style></head><body><main><header><div><h1>✦ بكسل عاداتي</h1><p class="muted">خطوة صغيرة كل يوم تصنع فرقًا كبيرًا.</p></div><span class="year" id="year"></span></header><section class="stats"><div class="stat"><span class="muted">عاداتي</span><strong id="count">0</strong></div><div class="stat"><span class="muted">إنجازات اليوم</span><strong id="today">0</strong></div><div class="stat"><span class="muted">إجمالي الإنجازات</span><strong id="total">0</strong></div></section><section class="card"><h2>إضافة عادة جديدة ✨</h2><form id="form"><input id="name" maxlength="45" required placeholder="مثلاً: قراءة 10 صفحات" aria-label="اسم العادة"><input id="color" type="color" value="#9471cf" aria-label="لون العادة"><button type="submit">+ إضافة عادة</button></form></section><section id="habits"></section><footer>كل مربع ملوّن يعني يومًا التزمتِ فيه بعادتك ♡</footer></main><script>const key='habit-pixel-ar-v1',date=new Date(),year=date.getFullYear(),todayKey=local(date);document.getElementById('year').textContent=year;let habits=[];try{habits=JSON.parse(localStorage.getItem(key))||[]}catch{}function local(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){localStorage.setItem(key,JSON.stringify(habits))}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('count').textContent=habits.length;document.getElementById('today').textContent=habits.filter(h=>h.days[todayKey]).length+' / '+habits.length;document.getElementById('total').textContent=habits.reduce((n,h)=>n+Object.keys(h.days).filter(k=>h.days[k]).length,0);const root=document.getElementById('habits');root.innerHTML=habits.length?'':'<section class="card empty">لا توجد عادات بعد. أضيفي أول عادة وابدئي رحلتك 🌱</section>';habits.forEach(h=>{let done=!!h.days[todayKey],card=document.createElement('section');card.className='card';let head=document.createElement('div');head.className='habit-head';head.innerHTML='<div><h2>'+escapeHTML(h.name)+'</h2><span class="muted">'+Object.values(h.days).filter(Boolean).length+' يوم إنجاز خلال كل السنوات</span></div>';let controls=document.createElement('div');controls.className='top';let toggle=document.createElement('button');toggle.className=done?'today done':'today';toggle.textContent=done?'✓ أنجزت اليوم':'تحديد إنجاز اليوم';toggle.onclick=()=>flip(h.id,todayKey);let del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=()=>{if(confirm('هل تريدين حذف هذه العادة وسجلها؟')){habits=habits.filter(x=>x.id!==h.id);save();render()}};controls.append(toggle,del);head.append(controls);card.append(head);let grid=document.createElement('div');grid.className='grid';grid.setAttribute('aria-label','تقويم إنجازات '+h.name);let start=new Date(year,0,1),offset=start.getDay();for(let i=0;i<offset;i++){let blank=document.createElement('span');grid.append(blank)}for(let d=new Date(year,0,1);d.getFullYear()===year;d.setDate(d.getDate()+1)){let k=local(d),p=document.createElement('button');p.className='pixel'+(k>todayKey?' future':'');p.style.background=h.days[k]?h.color:'';p.title=k+(h.days[k]?' ✓':'');p.setAttribute('aria-label',k+(h.days[k]?' مكتمل':' غير مكتمل'));p.disabled=k>todayKey;p.onclick=()=>flip(h.id,k);grid.append(p)}card.append(grid);let legend=document.createElement('div');legend.className='legend';legend.innerHTML='<span class="sample"></span> لم يُنجز <span class="sample" style="background:'+h.color+'"></span> أُنجز <span>• اضغطي على أي يوم سابق لتعديل تسجيله</span>';card.append(legend);root.append(card)})}function flip(id,k){let h=habits.find(x=>x.id===id);if(!h)return;h.days[k]?delete h.days[k]:h.days[k]=true;save();render()}document.getElementById('form').onsubmit=e=>{e.preventDefault();let name=document.getElementById('name').value.trim();if(!name)return;habits.push({id:Date.now().toString()+Math.random(),name,color:document.getElementById('color').value,days:{}});save();e.target.reset();render()};render();</script></body></html>
